<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>픽셀 던전 탐험가 (Pixel Dungeon Explorer)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div id="ui-container">
            <div id="stats-panel">
                <div id="hp-bar">HP: <span id="hp-value">100/100</span></div>
                <div id="level-info">Level: <span id="level-value">1</span></div>
                <div id="xp-info">XP: <span id="xp-value">0</span></div>
            </div>
            <div id="message-log"></div>
            <div id="inventory-panel" class="hidden">
                <h3>Inventory</h3>
                <ul id="inventory-list"></ul>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
